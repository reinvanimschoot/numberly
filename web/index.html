<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Numberly</title>
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
        <style>
            body {
                margin: 0;
                padding: 2rem 1rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                font-family: system-ui, sans-serif;
                background: #f4f4f5;
                color: #18181b;
            }

            h1 {
                margin: 0;
            }

            .hint {
                margin: 0;
                max-width: 280px;
                font-size: 0.875rem;
                line-height: 1.4;
                text-align: center;
                color: #52525b;
            }

            canvas {
                width: 280px;
                height: 280px;
                border-radius: 8px;
                cursor: crosshair;
                touch-action: none; /* don't scroll the page while drawing on a phone */
            }

            .buttons {
                display: flex;
                gap: 0.5rem;
            }

            button {
                font-size: 1rem;
                padding: 0.5rem 1.25rem;
                border: 1px solid #d4d4d8;
                border-radius: 6px;
                background: white;
                cursor: pointer;
            }

            button.primary {
                background: #18181b;
                border-color: #18181b;
                color: white;
            }

            button:disabled {
                opacity: 0.5;
                cursor: default;
            }

            #result {
                min-height: 3.5rem;
                font-size: 3rem;
                font-weight: 700;
            }

            #bars {
                width: 280px;
                display: grid;
                grid-template-columns: 1.5rem 1fr 3.5rem;
                gap: 0.25rem 0.5rem;
                align-items: center;
                font-variant-numeric: tabular-nums;
            }

            .bar {
                height: 0.75rem;
                border-radius: 4px;
                background: #e4e4e7;
                overflow: hidden;
            }

            .bar > div {
                height: 100%;
                background: #a1a1aa;
            }

            .bar.best > div {
                background: #18181b;
            }

            .percent {
                text-align: right;
            }
        </style>
    </head>
    <body>
        <h1>Numberly</h1>

        <p class="hint">
            Draw a single digit, from 0 to 9.<br />
            Tip: draw a 1 as a single straight line. The model learned from
            handwriting where a 1 usually has no hook at the top, so a hooked 1
            is often mistaken for a 7.
        </p>

        <canvas id="canvas" width="280" height="280"></canvas>

        <div class="buttons">
            <button id="clear">Clear</button>
            <button id="predict" class="primary" disabled>
                Loading model…
            </button>
        </div>

        <div id="result"></div>
        <div id="bars"></div>

        <script>
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const resultEl = document.getElementById("result");
            const barsEl = document.getElementById("bars");
            const predictButton = document.getElementById("predict");

            // ---------- drawing ----------

            // MNIST style: white strokes on black, thick, with round ends
            ctx.strokeStyle = "white";
            ctx.lineWidth = 18;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            let drawing = false;

            function clearCanvas() {
                // a fresh canvas is transparent, so fill it with black explicitly
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                resultEl.textContent = "";
                barsEl.innerHTML = "";
            }

            // convert a pointer position to canvas pixel coordinates
            function getPoint(event) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x:
                        (event.clientX - rect.left) *
                        (canvas.width / rect.width),
                    y:
                        (event.clientY - rect.top) *
                        (canvas.height / rect.height),
                };
            }

            canvas.addEventListener("pointerdown", (event) => {
                drawing = true;
                canvas.setPointerCapture(event.pointerId); // keep drawing even if the pointer leaves the canvas
                const { x, y } = getPoint(event);
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x, y); // so a single click draws a dot
                ctx.stroke();
            });

            canvas.addEventListener("pointermove", (event) => {
                if (!drawing) return;
                const { x, y } = getPoint(event);
                ctx.lineTo(x, y);
                ctx.stroke();
            });

            canvas.addEventListener("pointerup", () => (drawing = false));
            canvas.addEventListener("pointercancel", () => (drawing = false));

            // ---------- model ----------

            // the model is loaded from the Hugging Face model repo, not from this site.
            // if that fails, fall back to a local copy next to this page (for testing).
            const MODEL_URL =
                "https://huggingface.co/reinvanimschoot/numberly/resolve/main/numberly.onnx";
            const LOCAL_MODEL_URL = "numberly.onnx";

            let session;

            async function loadModel() {
                try {
                    session = await ort.InferenceSession.create(MODEL_URL);
                    console.log("Loaded model from Hugging Face");
                } catch (error) {
                    console.warn(
                        "Could not load model from Hugging Face, trying local copy",
                        error,
                    );
                    try {
                        session =
                            await ort.InferenceSession.create(LOCAL_MODEL_URL);
                        console.log("Loaded local model");
                    } catch (localError) {
                        console.error(
                            "Could not load local model either",
                            localError,
                        );
                        predictButton.textContent = "Model unavailable";
                        return;
                    }
                }
                predictButton.disabled = false;
                predictButton.textContent = "Predict";
            }

            // MNIST-style preprocessing, the same steps as preprocess.py:
            // crop to the drawing, scale the longest side to 20 pixels,
            // and center it by center of mass on a 28x28 black image.
            // Returns 784 numbers between 0 and 1, or null if nothing was drawn.
            function getInput() {
                const { width, height } = canvas;
                const { data } = ctx.getImageData(0, 0, width, height); // RGBA: 4 values per pixel

                // 1. find the bounding box of the drawing (all pixels that aren't black)
                let minX = width,
                    minY = height,
                    maxX = -1,
                    maxY = -1;
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        if (data[(y * width + x) * 4] > 0) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }
                if (maxX < 0) return null; // nothing drawn

                const boxWidth = maxX - minX + 1;
                const boxHeight = maxY - minY + 1;

                // 2. crop and scale so the longest side is 20 pixels, keeping proportions
                const scale = 20 / Math.max(boxWidth, boxHeight);
                const digitWidth = Math.max(1, Math.round(boxWidth * scale));
                const digitHeight = Math.max(1, Math.round(boxHeight * scale));

                const digit = document.createElement("canvas");
                digit.width = digitWidth;
                digit.height = digitHeight;
                const digitCtx = digit.getContext("2d");
                digitCtx.imageSmoothingQuality = "high";
                // drawImage with 9 arguments: take a rectangle from the source, draw it at a new size
                digitCtx.drawImage(
                    canvas,
                    minX,
                    minY,
                    boxWidth,
                    boxHeight,
                    0,
                    0,
                    digitWidth,
                    digitHeight,
                );

                // 3. find the center of mass of the white pixels (a brightness-weighted average position)
                const digitData = digitCtx.getImageData(
                    0,
                    0,
                    digitWidth,
                    digitHeight,
                ).data;
                let total = 0,
                    sumX = 0,
                    sumY = 0;
                for (let y = 0; y < digitHeight; y++) {
                    for (let x = 0; x < digitWidth; x++) {
                        const brightness =
                            digitData[(y * digitWidth + x) * 4] / 255;
                        total += brightness;
                        sumX += x * brightness;
                        sumY += y * brightness;
                    }
                }
                if (total === 0) return null;
                const centerX = sumX / total;
                const centerY = sumY / total;

                // 4. paste it on a black 28x28 image, so that the center of mass lands in the middle
                const small = document.createElement("canvas");
                small.width = 28;
                small.height = 28;
                const smallCtx = small.getContext("2d");
                smallCtx.fillStyle = "black";
                smallCtx.fillRect(0, 0, 28, 28);
                smallCtx.drawImage(
                    digit,
                    Math.round(14 - centerX),
                    Math.round(14 - centerY),
                );

                // 5. read the 28x28 pixels as 784 numbers between 0 and 1, row by row
                const smallData = smallCtx.getImageData(0, 0, 28, 28).data;
                const input = new Float32Array(28 * 28);
                for (let i = 0; i < 28 * 28; i++) {
                    input[i] = smallData[i * 4] / 255; // red channel = brightness, since the image is grayscale
                }
                return input;
            }

            function softmax(logits) {
                const max = Math.max(...logits); // subtracting the max keeps Math.exp from overflowing
                const exps = logits.map((x) => Math.exp(x - max));
                const sum = exps.reduce((a, b) => a + b, 0);
                return exps.map((x) => x / sum);
            }

            async function predict() {
                const pixels = getInput();
                if (pixels === null) {
                    resultEl.textContent = "";
                    barsEl.innerHTML = "";
                    return; // nothing drawn yet
                }

                const input = new ort.Tensor("float32", pixels, [1, 784]);
                const results = await session.run({ input });

                const logits = Array.from(results.logits.data);
                const probabilities = softmax(logits);
                const prediction = probabilities.indexOf(
                    Math.max(...probabilities),
                );

                resultEl.textContent = prediction;
                renderBars(probabilities, prediction);
            }

            // ---------- results ----------

            function renderBars(probabilities, prediction) {
                barsEl.innerHTML = "";

                probabilities.forEach((p, digit) => {
                    const label = document.createElement("div");
                    label.textContent = digit;

                    const bar = document.createElement("div");
                    bar.className = digit === prediction ? "bar best" : "bar";
                    const fill = document.createElement("div");
                    fill.style.width = `${p * 100}%`;
                    bar.appendChild(fill);

                    const percent = document.createElement("div");
                    percent.className = "percent";
                    percent.textContent = `${(p * 100).toFixed(1)}%`;

                    barsEl.append(label, bar, percent);
                });
            }

            // ---------- start ----------

            document
                .getElementById("clear")
                .addEventListener("click", clearCanvas);
            predictButton.addEventListener("click", predict);

            clearCanvas();
            loadModel();
        </script>
    </body>
</html>
