[project]
name = "numberly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rein Van Imschoot", email = "reinvanimschoot@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "onnx>=1.23.1",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
numberly-predict = "numberly.predict:main"
numberly-train = "numberly.train:main"
numberly-export = "numberly.export:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
